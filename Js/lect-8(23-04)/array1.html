<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        let fruits = ['apple','banana','kiwi'];

        console.log(fruits);
        

        console.log(fruits.length);
        console.log(fruits.at(0));

        console.log(fruits[fruits.length-1]);
        console.log(fruits.at(-1));

        fruits.push('mango');
        console.log(fruits);

        fruits.pop();
        console.log(fruits);

        fruits.shift();
        console.log(fruits);

        fruits.unshift('watermallon');
        console.log(fruits);

        for(key in fruits){
            console.log(key);
            
        }

        console.log(fruits.join('-'));
        console.log("watermallon-banana-kiwi".split('-'));
        
        
        
        
        
        
        
        
    </script>
</body>
</html>
