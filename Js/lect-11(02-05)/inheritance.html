            printEmployee(){
                console.log(`You empi id=${this.empid} and salary = ${this.salary}`);
                
            }
        }

        let emp1 = new Employee('emp-123',21000,'Mohit','m@gmail.com');
        emp1.printUser();
        emp1.printEmployee();
