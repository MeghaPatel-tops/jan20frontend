<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function alertExample(){
            alert('Welcome to js tutorials');
        }
        function promptExample(){
            let name = prompt('Enter Your name');
            alert(name)
        }
        function confirmExample(){
            let flag = confirm('You want to delete item?');
            alert(flag)
        }
    </script>
</head>
<body>
    <button onclick="alertExample()">Alert Example</button>
    <button onclick="promptExample()">Prompt Example</button>
    <button onclick="confirmExample()">Confirm Example</button>
</body>
</html>
