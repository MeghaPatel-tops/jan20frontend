<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Number datatype
        let x=100;
        console.log('x=',x);
        console.log(typeof(x));


        //Bigint datatype
        let num=90071992547409n;
        console.log("num",num);
        console.log(typeof(num));

        //String Datatype
        let str="Megha";
        console.log(str);
        console.log(typeof(str));

        //Boolean
        let flag=false;
        console.log("flag",flag);
        console.log(typeof(flag));


         //Null
        let status=null;
        console.log("status",status);
        console.log(typeof(status));

        //Undefine
        let productName;
        console.log(productName);
        console.log(typeof(productName));

        //Object
        let user={
            name:'megha',
            email:'m@test.com'
        }

        console.log(user);
        console.log(typeof(user));
        
        
        
        


        
        
        
        
        
        


        
        
    </script>
</body>
</html>
