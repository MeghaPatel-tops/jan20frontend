<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="ProimseRun()">click</button>
    
    <script>
      

        function ProimseRun(){
            let myPromise = new Promise((resolve,reject)=>{
                let age = prompt('Enter age');
                if(age>=18){
                    resolve(age);
                }
                else{
                    reject(age)
                }
            });
            myPromise.then((age)=>{
                console.log(`Your age:${age} is perfect for voting`);
                
            })
            .catch((age)=>{
                 console.log(`Your age:${age} is not perfect for voting`)
            })
        }
    </script>
</body>
</html>
