<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            background-color: black;
            height: 80px;
            display: flex;
            padding: 0px 50px;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .navitem{
             display: flex;
             gap: 20px;
        }
        .navitem a{
             color: white;
        }

        .row{
            margin-top: 20px;
             padding: 100px;
             background-color: whitesmoke;
             display: grid;
             grid-template-columns: repeat(3,1fr);
             gap: 20px;
        }
        .col{
            width: 100%;
            height: 200px;
            border: 2px solid red;
            border-radius: 10px;
        }


        @media screen and (max-width:600px) {
             nav{
            
            padding: 50px 20px;
             flex-direction: column;
            color: white;
            align-items: flex-start;
            gap: 20px;
            height: auto;
        }
           .navitem{
               flex-direction: column;
           }
           .row{
             grid-template-columns: 1fr;
             gap: 30px;
        }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logodiv">
            <span>Navbar</span>
        </div>
        <div class="navitem">
            <div class="navlink"><a href="">Link-1</a></div>
            <div class="navlink"><a href="">Link-2</a></div>
            <div class="navlink"><a href="">Link-3</a></div>
            <div class="navlink"><a href="">Link-4</a></div>
            <div class="navlink"><a href="">Link-5</a></div>
        </div>
        <div class="login-div">
              <button>Login</button>
        </div>
    </nav>
    <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
    </div>
</body>
</html>
