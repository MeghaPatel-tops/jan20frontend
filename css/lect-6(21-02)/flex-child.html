<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .main{
            height: 400px;
            border: 5px solid black;
            width: 100%;
             padding: 0px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            align-items: flex-start;
            /* flex-wrap: wrap-reverse; */

        }
        .box{
            background-color: red;
           height: 100px;
           width: 100px;
            color: white;
        }
    </style>
</head>
<body>
   
    <div class="main">
        <div class="box" id="box-1" style="order: 3;">box-1</div>
        <div class="box" id="box-2" style="order: 2;flex-basis: 300px;align-self: center;">box-2</div>
        <div class="box" id="box-3" style="order: 1;">box-3</div>
        <div class="box" id="box-4" style="order: 4; align-self: flex-end;">box-4</div>
          <div class="box" id="box-4" style="order: 4;flex-shrink: 2;">box-5</div>
            <div class="box" id="box-4" style="order: 4;">box-6</div>
       
        
    </div>
</body>
</html>
