<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img-1{
            filter: brightness(30%);
        }
        #img-2{
            filter: blur(5px);
        }
        #img-3{
            filter: invert(30%);
        }
        #img-4{
            filter: saturate(40%);
        }
        #img-5{
            filter: drop-shadow(5px 5px 3px black);
        }
        #img-6{
            filter: contrast(10%);
        } 
        #img-7{
            filter: opacity(60%);
        } 
        #img-8{
            filter: hue-rotate(90deg);
        }
        
    </style>
</head>
<body>
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-1">
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-2">
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-3">
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-4">
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-5">
    <br>
    <img src="../lect-4(15-02)/images.jpg" alt="" id="img-6">
     <img src="../lect-4(15-02)/images.jpg" alt="" id="img-7">
     <img src="../lect-4(15-02)/images.jpg" alt="" id="img-8">
</body>
</html>
