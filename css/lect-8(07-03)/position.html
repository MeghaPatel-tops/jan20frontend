<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first{
            background-color: gray;
            padding: 20px;
            position: relative;
            top:0px;
        }
        .outer{
            height: 300px;
            width: 300px;
            border: 5px solid black;
            position: relative;
            top: 200px;
        }
        .inner{
            height: 50px;
            width: 50px;
            background-color: blue;
            position: absolute;
            right: 0;
            bottom: 0;
        }
        .fixed{
            height: 200px;
            width: 200px;
            background-color: aqua;
            position: fixed;
            right: 10px;
            top: 200px;
        }
        .nav{
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px 0px;
            position: sticky;
            top: 0;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="first">
        hello
    </div>
    <div class="nav">
        Navbar
    </div>

    <div class="fixed">
        This is fixed div
    </div>

    <div class="outer">
        relative example
        <div class="inner">
            absolute example
        </div>
    </div>
     <div class="outer">
        relative example
        <div class="inner">
            absolute example
        </div>
    </div>
     <div class="outer">
        relative example
        <div class="inner">
            absolute example
        </div>
    </div>
     <div class="outer">
        relative example
        <div class="inner">
            absolute example
        </div>
    </div>
</body>
</html>
