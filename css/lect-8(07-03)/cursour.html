<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .btn:hover{
            cursor: zoom-in;
        }
        .btn{
            padding: 10px 20px;
        }
        #btn-1{
            background-color: red;
            color: white;
            border: none;
        }
         #btn-2{
            background-color: red;
            color: white;
            border: none;
            border-radius: 10px;
        }
        #btn-3{
            border: 2px solid red;
            background-color: transparent;
            color: red;
            border-radius: 5px;
        }
         #btn-4{
            border: 2px solid red;
            background-color: transparent;
            color: red;
            border-radius: 5px;
        }
        #btn-4:hover{
            
            background-color: red;
            color: white;
            border-radius: 5px;
        }
        #btn-5{
            background-color: white;
            color: black;
            border: none;
            box-shadow: 2px 2px 3px gray;
        }
    </style>
</head>
<body>
    <button class="btn">Click Me</button>

    <button class="btn" id="btn-1">bgcolor</button>
    <button class="btn" id="btn-2">btn-radius</button>
    <button class="btn" id="btn-3">btn-border</button>
    <button class="btn" id="btn-4">btn-hover</button>
     <button class="btn" id="btn-5">btn-shadow</button>
</body>
</html>
