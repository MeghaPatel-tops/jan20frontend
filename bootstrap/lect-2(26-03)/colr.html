<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     

</head>
<body>
    <h1 class="text-black-50 bg-white">Hello world</h1>

    <div>
        <h2>used d-block class to set inline ele. to block level(span)</h2>
        <span class="d-block">Item-1</span>
        <span class="d-block">Item-2</span>
        <span class="d-block">Item-3</span>
        <span class="d-block">Item-4</span>
        <span class="d-block">Item-5</span>
        <span class="d-block">Item-6</span>
    </div>
    <div>
        <h2>used d-inline class to set block ele. to inline (div)</h2>
        <div class="d-inline">Box-1</div>
        <div class="d-inline">Box-2</div>
        <div class="d-inline">Box-3</div>
        <div class="d-inline">Box-4</div>
        <div class="d-inline">Box-5</div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        

</body>
</html>
